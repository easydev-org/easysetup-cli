name: release

# Cross-compile for both architectures and publish.
#
# CGO is disabled in every build, which is what makes cross-compilation trivial
# and the result genuinely static: no libc to match, so the same binary runs on
# debian, alpine and distroless alike. Verified with ldd: "not a dynamic
# executable".
#
# Both architectures are built on amd64 runners by cross-compiling. An arm64
# runner (ubuntu-24.04-arm) exists only on paid plans, and CGO=0 makes the cross
# build exact anyway - there is no libc to bind to, so GOARCH is the whole story.
# The arm64 binary is format-checked; the amd64 one is also executed.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go build -trimpath -ldflags='-s -w' -o easysetup .

      - name: it must be static
        run: |
          set -euo pipefail
          file easysetup
          out=$(ldd easysetup 2>&1 || true)
          echo "$out"
          echo "$out" | grep -qE 'not a dynamic executable|statically linked' || {
            echo "::error::not static"; exit 1; }
          echo "statically linked"

      - name: the binary matches the requested architecture
        run: |
          set -euo pipefail
          file easysetup
          case "${{ matrix.goarch }}" in
            amd64) want='x86-64' ;;
            arm64) want='ARM aarch64' ;;
          esac
          file easysetup | grep -q "$want" || {
            echo "::error::expected $want"; file easysetup; exit 1; }
          echo "architecture ok: ${{ matrix.goarch }}"

      # Only the native architecture can be executed here.
      - name: it runs (amd64 only)
        if: matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          ./easysetup --help > /dev/null
          ./easysetup list | head -3
          echo "binary runs on $(uname -m)"

      - uses: actions/upload-artifact@v4
        with:
          name: easysetup-linux-${{ matrix.goarch }}
          path: easysetup
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/bin
          merge-multiple: false

      - name: name by architecture and checksum
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets
          for d in /tmp/bin/*/; do
            goarch=$(basename "$d" | sed 's/^easysetup-linux-//')
            install -m 0755 "$d/easysetup" "/tmp/assets/easysetup-linux-$goarch"
            sha256sum "/tmp/assets/easysetup-linux-$goarch" \
              | cut -d' ' -f1 > "/tmp/assets/easysetup-linux-$goarch.sha256"
            ls -lh "/tmp/assets/easysetup-linux-$goarch"
          done

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "tag: $tag"
          # Derived, not fixed: a re-run publishes a new version rather than
          # silently replacing one a consumer may already have pinned.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" /tmp/assets/* --clobber
          else
            gh release create "$tag" /tmp/assets/* \
              --title "easysetup $tag" \
              --notes "Static installer for easysetup toolchains. linux/amd64 and linux/arm64, CGO disabled, no interpreter - runs on any Linux userland including distroless."
          fi
