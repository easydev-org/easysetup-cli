name: release

# Build for both architectures and publish.
#
# CGO is disabled in every build, so the result is genuinely static: no libc to
# match, and the same binary runs on debian, alpine and distroless alike.
# Verified with ldd: "not a dynamic executable".
#
# Each architecture builds on its own native runner (ubuntu-latest is amd64,
# ubuntu-24.04-arm is arm64) rather than cross-compiling, so the arm64 binary is
# actually EXECUTED here rather than only format-checked. Cross-compiling would
# probably produce the same bytes, but "probably" is not what a release should
# rest on when a native runner is available.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go build -trimpath -ldflags='-s -w' -o easysetup .

      - name: it must be static
        run: |
          set -euo pipefail
          file easysetup
          out=$(ldd easysetup 2>&1 || true)
          echo "$out"
          echo "$out" | grep -qE 'not a dynamic executable|statically linked' || {
            echo "::error::not static"; exit 1; }
          echo "statically linked"

      # Runs on both, because each architecture has a native runner. This is the
      # difference from cross-compiling: the arm64 binary is exercised, not just
      # inspected.
      - name: it runs
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "${{ matrix.goarch }}:$arch" in
            amd64:x86_64|arm64:aarch64) : ;;
            *) echo "::error::built ${{ matrix.goarch }} but the runner is $arch"; exit 1 ;;
          esac
          ./easysetup --help > /dev/null
          ./easysetup list | head -3
          echo "binary runs on $arch"

      - uses: actions/upload-artifact@v4
        with:
          name: easysetup-linux-${{ matrix.goarch }}
          path: easysetup
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/bin
          merge-multiple: false

      - name: name by architecture and checksum
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets
          for d in /tmp/bin/*/; do
            goarch=$(basename "$d" | sed 's/^easysetup-linux-//')
            install -m 0755 "$d/easysetup" "/tmp/assets/easysetup-linux-$goarch"
            sha256sum "/tmp/assets/easysetup-linux-$goarch" \
              | cut -d' ' -f1 > "/tmp/assets/easysetup-linux-$goarch.sha256"
            ls -lh "/tmp/assets/easysetup-linux-$goarch"
          done

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "tag: $tag"
          # Derived, not fixed: a re-run publishes a new version rather than
          # silently replacing one a consumer may already have pinned.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" /tmp/assets/* --clobber
          else
            gh release create "$tag" /tmp/assets/* \
              --title "easysetup $tag" \
              --notes "Static installer for easysetup toolchains. linux/amd64 and linux/arm64, CGO disabled, no interpreter - runs on any Linux userland including distroless."
          fi
